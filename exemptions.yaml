# Known-defect exemptions (R15-16). Each entry needs an owner, an approver and
# an expiry date. An expired exemption stops suppressing its finding.
#
# - id: EX-0001
#   check: ai-config.content-lint
#   repo: link_core
#   path: AGENTS.md
#   owner: name
#   approved_by: name
#   reason: why the finding is accepted for now
#   expires: 2026-12-31
#
# A finding on a pull request as a whole has no path: pr.title, pr.ticket,
# pr.description, pr.diff-size and the other pull request checks. Exempt one
# for a repository with path: '*' (it then applies to every pull request in
# that repository until it expires).
version: 1
exemptions: []
