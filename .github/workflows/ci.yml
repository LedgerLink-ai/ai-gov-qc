# Checks qc-workflows on Windows, macOS and Linux, then builds the installable
# package and installs it, as a developer would. When it passes on main, the
# release workflow publishes the package it built (when the version is new).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: node scripts/release.js --check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run validate

      # The scanners at the pinned versions, installed the way developers do.
      - name: qa setup
        shell: bash
        run: |
          node packages/engine/bin/qa.js setup --config . --home "$RUNNER_TEMP/qa-home" --no-global-hooks --no-git-template
          echo "QA_HOME=$RUNNER_TEMP/qa-home" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/qa-home/bin" >> "$GITHUB_PATH"
      # Unit, integration, end-to-end (CLI and git hook lifecycle), security,
      # negative authorization and performance tests (docs/TESTING.md).
      - run: npm test
      - run: npm run conform

      # Performance benchmark (docs/PERFORMANCE.md), kept for comparison in review.
      - name: benchmark
        shell: bash
        run: node scripts/benchmark.js --files 300 --repeat 3 --json "out/benchmark-${{ matrix.os }}.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-${{ matrix.os }}
          path: out/benchmark-${{ matrix.os }}.json
          if-no-files-found: error

      # The package: built, installed globally from the file, and run.
      - run: npm run package
      - name: install and run the package
        shell: bash
        run: |
          npm install -g --no-audit --no-fund --ignore-scripts ./out/ledgerlink-qa-*.tgz
          qa version
          qa validate
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: |
            out/ledgerlink-qa-*.tgz
            out/ledgerlink-qa-*.tgz.sha256
          if-no-files-found: error
