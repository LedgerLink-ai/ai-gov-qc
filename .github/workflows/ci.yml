# Checks qc-workflows on Windows, macOS and Linux, then builds the installable
# package and installs it, as a developer would. When it passes on main, the
# release workflow publishes the package it built (when the version is new).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: node scripts/release.js --check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run validate

      # The scanners at the pinned versions, installed the way developers do.
      - name: qa setup
        shell: bash
        run: |
          node packages/engine/bin/qa.js setup --config . --home "$RUNNER_TEMP/qa-home" --no-git-template
          echo "QA_HOME=$RUNNER_TEMP/qa-home" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/qa-home/bin" >> "$GITHUB_PATH"
      - run: npm test
      - run: npm run conform

      # The package: built, installed globally from the file, and run.
      - run: npm run package
      - name: install and run the package
        shell: bash
        run: |
          npm install -g --no-audit --no-fund out/ledgerlink-qa-*.tgz
          qa version
          qa validate
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package
          path: |
            out/ledgerlink-qa-*.tgz
            out/ledgerlink-qa-*.tgz.sha256
          if-no-files-found: error
