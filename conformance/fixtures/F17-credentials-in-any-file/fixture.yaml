id: F17
title: Credentials in any file - configuration, environment, shell, CI, code, XML, URLs, command lines, key files and long tokens (AIQC-89)
repo: link_core
actor: human
as_of: 2027-01-08
requires: [gitleaks]
# Generated each run, so this repository holds no credential, not even split.
values:
  PASSWORD: { random: password, length: 16 }
  ALNUM: { random: alnum, length: 24 }
  # Longer than the 150 characters Gitleaks' generic rule stops at, with dots.
  TOKEN: { random: alnum, parts: [100, 100, 100] }
  # The shape of an AWS CodeArtifact token: a JWE of about 1,000 characters.
  CODEARTIFACT_TOKEN: { random: base64url, prefix: 'eyJ2ZXIiOjEsImlzdSI6', parts: [88, 22, 16, 900, 22] }
  KEY_FILE: { random: alnum, length: 200 }
exact: true
expect:
  - check: secrets.gitleaks
    path: .env
    blocking: true
  - check: secrets.gitleaks
    path: config/app.yaml
    blocking: true
  - check: secrets.gitleaks
    path: src/main/resources/application.properties
    blocking: true
