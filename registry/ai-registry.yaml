# Approved AI tools, models and MCP servers (CAP-14 C14-1, R14-6).
# Seeded from the commit-history review of 14 Oct 2026. Every tool stays
# `pending-inventory` until the week-1 inventory (task S-03) confirms its tier,
# models and owner. `models: ["*"]` means "not yet pinned", not "anything goes":
# it is replaced with the confirmed model list at inventory.
version: 1
updated: 2026-10-22

# trailer_aliases: how a Co-authored-by line is recognised as this tool (it then
# becomes Assisted-by, and the pull request gets the agent rules). An alias with
# an @ must equal the co-author's address exactly; any other alias must be a
# whole word of the co-author's name, or the login of a GitHub no-reply address
# (<id>+<login>@users.noreply.github.com). Matching ignores case.
tools:
  - id: claude-code
    name: Claude Code
    vendor: Anthropic
    status: pending-inventory
    tier: TBC
    models: ['*']
    owner: TBC
    review_by: 2026-11-06
    trailer_aliases: ['noreply@anthropic.com']
    profile:
      mcp_config: .mcp.json
      rule_file: CLAUDE.md
      exclusion_file: .claude/settings.json

  - id: cursor
    name: Cursor
    vendor: Anysphere
    status: pending-inventory
    tier: TBC
    models: ['*']
    owner: TBC
    review_by: 2026-11-06
    trailer_aliases: ['cursoragent@cursor.com']
    profile:
      mcp_config: .cursor/mcp.json
      rule_file: .cursor/rules/ledgerlink.mdc
      exclusion_file: .cursorignore

  - id: github-copilot
    name: GitHub Copilot
    vendor: GitHub
    status: pending-inventory
    tier: TBC
    models: ['*']
    owner: TBC
    review_by: 2026-11-06
    trailer_aliases: ['copilot']
    profile:
