# Limits and switch-on dates. Every value here is a proposed default until
# agreed in week 1 (grounding rule G3). A check reports only until its
# `block_from` date, then blocks; existing findings in a repo's baseline never
# block (P9). Dates follow the Security & AI Governance delivery plan.
version: 1

defaults:
  mode: report

local:
  # Locally, a check that would start after this budget is skipped with a
  # "runs in CI" notice. CI has no budget: there, a check that cannot run fails.
  # Budgets follow the AI Code Review implementation, section 2.
  # The three local checkpoints: pre-commit 5-15 s, pre-push 30-90 s, pre-PR
  # 1-3 min. These budgets cover the qa engine's own checks; the repository's
  # tests and build run as separate hooks in .pre-commit-config.yaml.
  time_budget_ms: 10000 # pre-commit
  prepush_time_budget_ms: 60000 # pre-push
  prepr_time_budget_ms: 180000 # qa prepr

# Pull request checks (stage 3), run by "qa prepr" before a pull request is
# opened and by the PR gate.
pr:
  # "<TICKET-123>-<description>" (LD-475-rc-sync) or "<type>/<description>"
  # (chore/precommit-local-checks).
  branch_pattern: '^(?:[A-Z][A-Z0-9]+-\d+(?:[-_.][A-Za-z0-9._-]+)?|(?:feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|hotfix|release)/[A-Za-z0-9._/-]+)$'
  diff_warn_lines: 400
  diff_max_lines: 1000
  diff_ignore: ['**/yarn.lock', '**/package-lock.json', '**/pnpm-lock.yaml', '**/*.snap']
  coverage_min_lines: 80

# Exact versions every developer machine and CI run. The hooks themselves are
# pinned by `rev` in each repository's .pre-commit-config.yaml; `qa doctor`
# compares what is installed with these.
tools:
  pre-commit: '4.7.0'
  gitleaks: '8.30.1'
  semgrep: '1.183.0'

protected:
  # Agents must not edit these (AGENTS.md rule 3, C15-4). Humans may, with
  # code-owner review (R11-6).
  tags: [ci-config, signing]
  globs: ['**/*.pem', '**/*.key', '**/*.p12', '**/*.pfx', '**/keys/**', '**/.env', '**/.env.*', '**/prod/**']

checks:
  secrets.gitleaks:
    mode: report
    block_from: 2026-11-16 # Gitleaks gate blocks (S-19)
  ai-config.content-lint:
    mode: report
    block_from: 2026-11-30 # context hygiene live week 4, two weeks report-only
  ai-config.mcp-allowlist:
    mode: report
    block_from: 2026-11-30
  # The commit message format (AI Code Review implementation, section 2) is
  # enforced from 2 Nov 2026, at commit time and on the pull request alike.
  commit.trailer:
    mode: block
  commit.conventional:
    mode: block
  sast.semgrep:
    mode: report
    block_from: 2026-11-16 # sast blocks from week 4
  # Pull request checks. The commit rule is the commit-msg rule applied to
  # every commit; a coverage threshold reports only in this phase (it would
  # block repositories whose coverage does not exist yet).
  pr.branch-name:
    mode: block
  pr.commits:
    mode: block
  pr.diff-size:
    mode: report
  tests.coverage:
    mode: report
  paths.protected:
    mode: report
    block_from: 2026-12-14 # blast-radius limits (S-38)
