# Limits and switch-on dates. Every value here is a proposed default until
# agreed in week 1 (grounding rule G3). A check reports only until its
# `block_from` date, then blocks; existing findings in a repo's baseline never
# block (P9). Dates follow the Security & AI Governance delivery plan.
version: 1

defaults:
  mode: report

local:
  # Locally, a check that would start after this budget is skipped with a
  # "runs in CI" notice. CI has no budget: there, a check that cannot run fails.
  # Budgets follow the AI Code Review implementation, section 2.
  # The three local checkpoints: pre-commit 5-15 s, pre-push 30-90 s, pre-PR
  # 1-3 min. These budgets cover the qa engine's own checks; the repository's
  # tests and build run as separate hooks in .pre-commit-config.yaml.
  time_budget_ms: 10000 # pre-commit
  prepush_time_budget_ms: 60000 # pre-push
  prepr_time_budget_ms: 180000 # qa prepr

# Pull request checks (stage 3), run by "qa prepr" before a pull request is
# opened and by the PR gate.
pr:
  # A ticket key in the branch name (LCORE-210-limit-invariants), which the
  # prepare-commit-msg hook copies into each commit message. Recommended, not
  # required (Development Guideline Policy, "Commit messages and signing").
  branch_pattern: '(?:^|/)[A-Z][A-Z0-9]+-\d+(?:$|[-_./])'
  diff_warn_lines: 400
  diff_max_lines: 1000
  diff_ignore: ['**/yarn.lock', '**/package-lock.json', '**/pnpm-lock.yaml', '**/*.snap']
  coverage_min_lines: 80

# Time limits. A scanner that runs past its limit is stopped: locally the
# check is deferred to CI with a notice; in CI it is an engine error (exit 2),
# never a pass. Environment overrides: QA_TOOL_TIMEOUT_MS (every scanner),
# QA_GIT_TIMEOUT_MS, QA_DOWNLOAD_TIMEOUT_MS.
timeouts:
  tool_ms: 300000 # one Gitleaks or Semgrep run
  tools:
    semgrep: 600000 # Semgrep starts a Python runtime and parses every file
  git_ms: 120000
  download_ms: 120000 # one attempt to download Gitleaks or upload a report
  network_retries: 3 # retries for a download or upload that failed for a network reason

# Checks of the same stage run in parallel (stages stay in order, P2), at most
# this many at a time; QA_PARALLELISM overrides it. Locally, scanner results
# are cached per file content in <qa home>/cache (QA_NO_CACHE=1 or --no-cache
# turns it off); CI never uses the cache.
performance:
  parallelism: 4
  cache: true

# The oldest qa that understands this configuration. An older qa stops with
# instructions instead of misreading it.
min_engine_version: '0.2.3'

# Exact versions every developer machine and CI run. The hooks themselves are
# pinned by `rev` in each repository's .pre-commit-config.yaml; `qa doctor`
# compares what is installed with these.
tools:
  pre-commit: '4.7.0'
  gitleaks: '8.30.1'
  semgrep: '1.183.0'

protected:
  # Agents must not edit these (AGENTS.md rule 3, C15-4). Humans may, with
  # code-owner review (R11-6).
  tags: [ci-config, signing]
  # The hook configuration and the dated baseline are protected too: changing
  # them changes what the checks block, so it needs code-owner review.
  globs:
    [
      '**/*.pem',
      '**/*.key',
      '**/*.p12',
      '**/*.pfx',
      '**/keys/**',
      '**/.env',
      '**/.env.*',
      '**/prod/**',
      '.pre-commit-config.yaml',
      '.husky/**',
      '.qa/baseline.sarif',
    ]

checks:
  secrets.gitleaks:
    mode: report
    block_from: 2026-11-16 # Gitleaks gate blocks (S-19)
  ai-config.content-lint:
    mode: report
    block_from: 2026-11-30 # context hygiene live week 4, two weeks report-only
  ai-config.mcp-allowlist:
    mode: report
    block_from: 2026-11-30
  # Commit messages (AI Code Review implementation v2, section 2; Development
  # Guideline Policy): no subject format is enforced, and nothing about the
  # message blocks locally. The pull request's pr-rules job checks the
  # Assisted-by trailer and is what blocks.
  commit.trailer:
    mode: report
  sast.semgrep:
    mode: report
    block_from: 2026-11-16 # sast blocks from week 4
  # Pull request checks before a pull request is opened ("qa prepr"). They
  # report only: the ticket key is recommended, not required; the trailer is
  # blocked by the pull request's pr-rules job; a coverage threshold would
  # block repositories whose coverage does not exist yet.
  pr.branch-name:
    mode: report
  pr.commits:
    mode: report
  pr.diff-size:
    mode: report
  tests.coverage:
    mode: report
  paths.protected:
    mode: report
    block_from: 2026-12-14 # blast-radius limits (S-38)
